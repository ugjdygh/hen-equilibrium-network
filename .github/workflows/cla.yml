name: CLA check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SIGN_PHRASE = "I have read CLA.md and I agree";
            const LABEL_SIGNED = "cla: signed";
            const LABEL_PENDING = "cla: pending";

            // 1. 定位 PR 与作者
            let prNumber, prAuthor;
            if (context.eventName === "pull_request_target") {
              prNumber = context.payload.pull_request.number;
              prAuthor = context.payload.pull_request.user.login;
            } else {
              if (!context.payload.issue.pull_request) {
                core.info("Not a pull request comment; skipping.");
                return;
              }
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              prNumber = pr.data.number;
              prAuthor = pr.data.user.login;
            }

            if (prAuthor.endsWith("[bot]")) {
              core.info(`Author ${prAuthor} is a bot; skipping.`);
              return;
            }

            // 2. 需要一个 PR 里"应当签署"的人：PR 作者 + 该 PR 全部提交作者
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });
            const required = new Set([prAuthor]);
            for (const c of commits) {
              const login = c.author && c.author.login;
              if (login && !login.endsWith("[bot]")) required.add(login);
            }
            const signers = new Set();

            // 3. 扫描会话中的签署语句（只认"应当签署"的人发的）
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100,
            });
            for (const c of comments) {
              const login = c.user && c.user.login;
              if (!login || login.endsWith("[bot]")) continue;
              if (c.body && c.body.includes(SIGN_PHRASE) && required.has(login)) signers.add(login);
            }
            // 3.0 读取全局台账：签过一次的人不再要求重复签署
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: "CLA-SIGNATURES.md", ref: "main",
              });
              const ledger = Buffer.from(res.data.content, "base64").toString("utf8");
              for (const login of required) {
                if (new RegExp(`\\|\\s*@${login}\\s*\\|`, "i").test(ledger)) signers.add(login);
              }
            } catch (e) {
              core.info("No CLA ledger found; relying on in-thread signatures only.");
            }
            const missing = [...required].filter((login) => !signers.has(login));

            // 3.1 全部签署
            if (missing.length === 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: [LABEL_SIGNED],
              });
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, name: LABEL_PENDING,
              }).catch(() => {});
              core.info(`CLA signed by all contributors on #${prNumber}: ${[...signers].join(", ")}`);
              return;
            }

            // 4. 未签署：打标签 + 只提示一次
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, labels: [LABEL_PENDING],
            });

            const botHandles = new Set(["github-actions[bot]"]);
            const alreadyPrompted = comments.some(
              (c) => botHandles.has(c.user && c.user.login) && c.body && c.body.includes("CLA.md")
            );
            if (!alreadyPrompted) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber,
                body: [
                  `**CLA pending — ${missing.map((u) => "@" + u).join(", ")}**`,
                  "",
                  "评审开始前，下列贡献者需要各自在这条 PR 里回一句签署声明（一次即可，覆盖此后全部贡献）：",
                  "",
                  "```",
                  "I have read CLA.md and I agree to its terms for my contributions to this repository.",
                  "```",
                  "",
                  "",
                  missing.map((u) => "- @" + u).join("\n"),
                  "",
                  "这只涉及许可链条，与贡献质量无关。协议原文：[CLA.md](../blob/main/CLA.md)。若本 PR 含生成式 AI 产出内容，请在描述中声明（CLA 第 6 条）。",
                ].join("\n"),
              });
            }
            core.info(`CLA pending for ${prAuthor} on #${prNumber}.`);
