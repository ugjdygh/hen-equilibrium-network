name: CLA sign-off ledger

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: cla-ledger
  cancel-in-progress: false

jobs:
  record:
    # 只在打了 cla-signoff 标签的 issue 上记录（防止有人在任意 issue 里刷签署）
    if: contains(github.event.issue.labels.*.name, 'cla-signoff')
    runs-on: ubuntu-latest
    steps:
      - name: Record signature
        uses: actions/github-script@v7
        with:
          script: |
            const SIGN_PHRASE = "I have read CLA.md and I agree to its terms for my contributions to this repository.";
            const LEDGER_PATH = "CLA-SIGNATURES.md";
            const login = context.payload.comment.user.login;
            const body = context.payload.comment.body || "";

            if (login.endsWith("[bot]")) {
              core.info("Bot comment; ignoring.");
              return;
            }
            if (!body.includes(SIGN_PHRASE)) {
              core.info("Comment does not contain the exact sign-off sentence; ignoring.");
              return;
            }

            // 1. 读取现有台账
            let ledger = "";
            let sha = undefined;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: LEDGER_PATH, ref: "main",
              });
              sha = res.data.sha;
              ledger = Buffer.from(res.data.content, "base64").toString("utf8");
            } catch (e) {
              core.info("Ledger not found; will create it.");
            }

            // 2. 幂等：已签过就不再追加
            if (new RegExp(`\\|\\s*@${login}\\s*\\|`, "i").test(ledger)) {
              core.info(`${login} already in ledger.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${login} 你已在台账中，无需重复签署。`,
              });
              return;
            }

            // 3. 取当前 CLA.md 版本指纹
            const claRes = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path: "CLA.md", ref: "main",
            });
            const claBytes = Buffer.from(claRes.data.content, "base64");
            const claSha = require("crypto").createHash("sha256").update(claBytes).digest("hex").slice(0, 16);

            // 4. 追加一行
            const now = new Date().toISOString().replace("T", " ").slice(0, 19) + "Z";
            const row = `| @${login} | ${now} | ${claSha} | [#${context.issue.number} comment ${context.payload.comment.id}](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${context.issue.number}#issuecomment-${context.payload.comment.id}) |`;
            const newLedger = ledger.trimEnd() + "\n" + row + "\n";

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: LEDGER_PATH,
              message: `chore(cla): record signature from @${login}`,
              content: Buffer.from(newLedger, "utf8").toString("base64"),
              sha,
              branch: "main",
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${login} 已记录（CLA v${claSha}）。此后你在这个仓库的任何 PR 都会被自动识别为已签署。`,
            });
            core.info(`Recorded signature for ${login}.`);
